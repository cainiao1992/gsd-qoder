name: Auto-upgrade gsd-core

on:
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for new gsd-core version
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').dependencies['@opengsd/gsd-core']")
          LATEST=$(npm view @opengsd/gsd-core version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date: $CURRENT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "Upgrade available: $CURRENT → $LATEST"
          fi

      - name: Upgrade dependency and bump version
        if: steps.check.outputs.update_needed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          npm install "@opengsd/gsd-core@$LATEST" --silent

          node -e "
            const fs = require('fs');
            const latest = process.env.LATEST;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@opengsd/gsd-core'] = latest;
            pkg.engines.gsd = latest;

            const parts = pkg.version.split('.').map(Number);
            parts[2] += 1;
            pkg.version = parts.join('.');

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('gsd-qoder → ' + pkg.version);
          "

          npm install --silent

      - name: Verify
        if: steps.check.outputs.update_needed == 'true'
        run: |
          npm run lint
          node bin/gsd-qoder.cjs doctor

      - name: Commit, tag, and push
        if: steps.check.outputs.update_needed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "chore: pin gsd-core $LATEST, bump version to $VERSION"
          git tag "v$VERSION"
          git push
          git push origin "v$VERSION"
